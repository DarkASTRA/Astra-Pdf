[package]
name = "astra-pdf-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdfcraft-render = { path = "../upstream/pdfcraft/crates/render" }
pdfcraft-cos = { path = "../upstream/pdfcraft/crates/cos" }
pdfcraft-organize = { path = "../upstream/pdfcraft/crates/organize" }
hayro = "0.7.1"
hayro-syntax = "0.7.2"
jni = "0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
android_logger = "0.14"
thiserror = "2"

[patch.crates-io]
hayro-interpret = { path = "../upstream/pdfcraft/vendor/hayro-interpret" }
hayro = { path = "../upstream/pdfcraft/vendor/hayro" }
hayro-syntax = { path = "../upstream/pdfcraft/vendor/hayro-syntax" }
hayro-cmap = { path = "../upstream/pdfcraft/vendor/hayro-cmap" }
hayro-postscript = { path = "../upstream/pdfcraft/vendor/hayro-postscript" }
hayro-jbig2 = { path = "../upstream/pdfcraft/vendor/hayro-jbig2" }
lopdf = { path = "../upstream/pdfcraft/vendor/lopdf" }
vello_common = { path = "../upstream/pdfcraft/vendor/vello_common" }
vello_cpu = { path = "../upstream/pdfcraft/vendor/vello_cpu" }
